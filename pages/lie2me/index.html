<div id="EASTEREGG" class="imageContainer" style="display: none;position: absolute; top:0%; left:0%; width:100%; height:100%">
	<img id="EASTEREGGIMAGE" alt="" style="width:100%;height:100%">
</div>
<audio id="EASTEREGGSONG" hidden></audio>



<script type="module">
	import Debug from "/common/functions/Debug.js"
	const easterEggDebug = new Debug(false, "lie2me-easteregg")

	const KONAMI_CODE= [
		"ArrowUp",
		"ArrowUp",
		"ArrowDown",
		"ArrowDown",
		"ArrowLeft",
		"ArrowRight",
		"ArrowLeft",
		"ArrowRight",
		"b",
		"a",
		"Enter",
	]

	let currentSpot = 0
	document.addEventListener("keydown", (event)=>{
		easterEggDebug.log(event.key)
		if (event.key == KONAMI_CODE[currentSpot]){
			currentSpot++
		}
		else{
			currentSpot = 0
		}

		if (currentSpot == KONAMI_CODE.length){
			easterEggDebug.log("HIT")
			document.getElementsByTagName("slide-scroll")[0].style.display = "none"

			const easterEggImage = document.getElementById("EASTEREGGIMAGE")
			const easterEggSong = document.getElementById("EASTEREGGSONG")

			async function getSecretEasterEgg() {
				const response = await fetch("https://api.securityofgod.com/get/easterEgg/wontyou")
				
				if (response.ok){
					const result = await response.json()
					return {"image":result.image, "song":result.song}
				}
				else{
					easterEggDebug.log("UHHHHHHH")
				}
			}

			getSecretEasterEgg().then((value)=>{
				easterEggDebug.log("Easter Egg Values", value)
				easterEggImage.src = value.image
				easterEggSong.src = value.song

			}).finally(()=>{
				document.getElementById("EASTEREGG").style.display = "block"
				easterEggSong.play()
			})
		}
	})
</script>

<!-- Scroll script -->
<script type="module">
	const container = document.getElementsByTagName("slide-scroll")[0]
	container.setScrollCases({
		0:{
			"top":[],
			"center":[0,1],
			"bottom":[2]
		},
		1:{
			"top":[1],
			"center":[0,2],
			"bottom":[]
		},
		2:{
			"goTo":1
		}
	})
	const l2m_button = document.getElementById("l2m-mv-button")
	const l2m_youtube = document.getElementById("l2m-mv-youtube")

	const l2m_footer = document.getElementById("l2m-mv-footer")
	const l2m_footer_button = document.getElementById("l2m-mv-footer-button")


	l2m_button.addEventListener("pointerdown",()=>{
		l2m_button.style.display = "none"
		l2m_footer.style.display = "none"
		l2m_footer_button.style.display = "none"

		l2m_youtube.style.display = "block"
	})

	l2m_footer_button.addEventListener("pointerup",(event)=>{
		event.preventDefault()
		event.stopPropagation()
		// console.log("hiiii")
		container.scrollHandler(1)
	})
</script>
