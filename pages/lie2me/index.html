<!-- Scroll script -->
<script type="module">
	import SlideScroll from "/common/scripts/slideScroll.js"
	const scroll = new SlideScroll()
	scroll.setScrollFunction((section)=>{
		switch (section) {
			case 0:
				scroll.toTheCenter(0)
				scroll.toTheCenter(1)
				scroll.toTheBottom(2)
				break;
			case 1:
				scroll.toTheCenter(0)
				scroll.toTheTop(1)
				scroll.toTheCenter(2)
				break;
			case 2:
				scroll.scrollHandler(1)
				break;
			default:
				scroll.scrollSwitchDefaultCase(section)
				break;
		}
	})

	const l2m_button = document.getElementById("l2m-mv-button")

		l2m_youtube.style.display = "block"
	})

	l2m_footer_button.addEventListener("pointerdown",(event)=>{

		event.preventDefault()
		scroll.scrollHandler(1)
	})

</script>


<!-- Canvas Script -->
<script>
	var videos = Array.from(document.getElementsByTagName("video"))
	var canvases = Array.from(document.getElementsByTagName("canvas"))

	if (videos.length == canvases.length){
		for (var i=0; i<videos.length;i++){
			const video = videos[i]
			const canvas = canvases[i]
			const canvasContext = canvas.getContext("2d")
			video.play()

			function paintCanvas(video,canvas){
				canvasContext.drawImage(video, 0,0, canvas.width,canvas.height)
				requestAnimationFrame(()=>paintCanvas(video,canvas))
			}

			requestAnimationFrame(()=>{paintCanvas(video, canvas)})
		}
	}
	else{
		console.log("woahwoahwoah....woah")
	}


</script>
