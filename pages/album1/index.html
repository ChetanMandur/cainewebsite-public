	<script type="module">
		import SlideScroll from "/common/scripts/slideScroll.js"
		const scroll = new SlideScroll()
		scroll.setScrollFunction((section)=>{
			switch (section) {
				case 0:
					scroll.chunkToTheCenter(0,1)
					scroll.chunkToTheBottom(1)
					break;
				case 1:
					scroll.chunkToTheCenter(0,2)
					scroll.chunkToTheBottom(2)
					break;
				
				case 2:
					scroll.chunkToTheTop(0,1)
					scroll.chunkToTheCenter(1,3)
					scroll.chunkToTheBottom(3)
					break;

				case 3:
					scroll.chunkToTheTop(0,3)
					scroll.toTheCenter(1)
					scroll.toTheCenter(3)
					scroll.chunkToTheBottom(4)
					break;
				
				case 4:
					scroll.chunkToTheTop(0,4)
					scroll.toTheCenter(1)
					scroll.chunkToTheCenter(4,5)
					scroll.chunkToTheBottom(5)
					break;

				case 5:
					scroll.chunkToTheTop(0,4)
					scroll.toTheCenter(1)
					scroll.chunkToTheCenter(4,7)
					scroll.chunkToTheBottom(6)
					break;

				case 6:
					scroll.chunkToTheTop(0,4)
					scroll.toTheCenter(1)
					scroll.chunkToTheCenter(4,7)
					scroll.chunkToTheBottom(7)
					break;


				default:
					scroll.chunkToTheTop(0,section)
					scroll.chunkToTheCenter(section, section+1)
					scroll.chunkToTheBottom(section+1)
					break;
			}
		})
	</script>
	<script type="module">
		document.addEventListener("TimerEntered",async (event)=>{
			const overlay = document.getElementById("overlay")
			const sectionsContainer = document.getElementsByClassName("sections-container")[0]
			const youtubeVideoContainer = document.getElementById("youtube-video-container")
			const youtubeVideo = document.getElementById("youtube-video")
			const errorContainer = document.getElementById("error-container")

			/**@type {Response}*/
			const result = await event.result

			if (result != undefined){
				youtubeVideo.src = await result.text()
				youtubeVideoContainer.style.display="block"
			}
			else{
				console.log("not happy")
				errorContainer.style.display="block"
			}
			overlay.style.display="none"
			sectionsContainer.style.display="none"

		})
	</script>
