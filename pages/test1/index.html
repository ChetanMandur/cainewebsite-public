<html lang="en">

    <link rel="stylesheet" href="/common/styles/base.css">

    <link rel="stylesheet" href="/common/styles/section.css">
    <link rel="stylesheet" href="/common/styles/links.css">
	<style>
		a{
			--link-hover-colour: red
		}
	</style>
</head>
<body>
	<div class="overlay">
		<countdown-timer debug date="https://api.securityofgod.com/get/releaseDate/test" result="https://api.securityofgod.com/get/timerResult/test"></countdown-timer>
	</div>
	<slide-scroll id="test1" debug>
		<div class="section">
			<video-canvas debug src="/pages/album1/assets/videos/test.webm" mobile-fit="cover" desktop-fit="scale-down" quality="high"></video-canvas>
		</div>
		<div class="section"> 
			<!-- <div class="section first-section"> -->
			<div class="section-link-tree">
				<div class="section-link-tree-header">
					test 1 page 1
				</div>
			</div>
		</div>
		<div class="section">
			<div class="section-link-tree">
				<div class="section-link-tree-header">

				</div>
				<div class="section-link-tree-links">
					<a id="wazup-button">wazzzupppp</a>
				</div>
			</div>
		</div>
	</slide-scroll>
	<script type="module">
		document.addEventListener("TimerEntered",async (event)=>{
			console.log("(index.html) Event caught!", event)
			const result = await event.result
			if (result == undefined){
				console.log("bruh")
			}
			else{
				console.log(await result.text())
			}
		})
	</script>
	<script type="module">
		const slideScroll = document.getElementsByTagName("slide-scroll")[0]

		slideScroll.setScrollCases({
			0:{
				"top":[],
				"center":[0],
				"bottom":[1],
				"function":()=>{
					console.log("YO MAMA")
				}
			},
		})
	</script>
	<script type="module">
		import pageInject from "/common/scripts/pageInject.js"
		document.getElementById("wazup-button").addEventListener("pointerdown",(event)=>{
			pageInject("/pages/album1", true, true)
		})
	</script>
</body>
</html>
