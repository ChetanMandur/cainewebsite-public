<style>
	canvas{
		width: 100%;
		height: 100%;
		object-fit:cover;
	}
	.content{
		display: flex;
		position: absolute;
		top:0;
		left:0;
		width:100%;
		height: 100%;

		justify-content: center;
		align-items: center;
		pointer-events: none;
	}
	.timer{
		width:fit-content;
		height:fit-content;
		font-family: 'Courier New', Courier, monospace;

	}
	.muteButton{
		position: absolute;
		right:0;
		bottom:0;
		width:3%;
		height:5%;
		
	}
	body{
		overflow: hidden;
		background-color: white;
		padding: 0;
		margin:0;
	}
</style>




<body>
	<canvas id="canvas" ></canvas>
	 <div class="content">
		<h1 class="timer" id="timer"></h1>
		<img class="muteButton" src="https://www.svgrepo.com/show/506727/mute.svg" id="muteButton" alt="mute">
	 </div>
	<video id="video" src="./public/test.webm"  autoplay hidden muted loop playsinline></video>
	<h1>hi</h1>
</body>



<script>
	var video = document.getElementById("video")
	var canvas = document.getElementById("canvas")
	var canvasContext = canvas.getContext("2d")
	var video = document.getElementById("video")

	var timer = document.getElementById("timer")
	var muteButton = document.getElementById("muteButton")

	canvas.addEventListener("click", ()=>{
		video.muted = !video.muted
		if (video.muted){
			muteButton.src = "https://www.svgrepo.com/show/506727/mute.svg"
		}
		else{
			muteButton.src = "https://www.svgrepo.com/show/506778/volume-up.svg"
		}
	})

	function paintCanvas(){
		canvasContext.drawImage(video, 0,0, canvas.width,canvas.height)
		requestAnimationFrame(()=>{paintCanvas()})

	}

	let releaseDate = new Date ("April 21, 2026 00:00:00").getTime()

	function updateTimer(){
		var distance = releaseDate - (new Date().getTime());

		var days = Math.floor(distance / (1000 * 60 * 60 * 24));
		var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
		var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
		var seconds = Math.floor((distance % (1000 * 60)) / 1000);
		
		if (hours < 10){
			hours = "0" + hours
		}
		if (minutes < 10){
			minutes = "0" + minutes
		}
		if (seconds < 10){
			seconds = "0" + seconds
		}

		timer.textContent = days + ":" + hours + ":" + minutes + ":" + seconds ;
		requestAnimationFrame(()=>{updateTimer()})
	}


	requestAnimationFrame(()=>{
		video.play()
		paintCanvas()
		updateTimer()
	})

</script>
