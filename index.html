	}
	.bottom{

	<video id="video" src="./public/test.webm"  autoplay hidden muted loop playsinline></video>

		<h1 class="bottomChangingText" style="top:10%;left:80%;color:white"></h1>




		<h1 class="bottomChangingNumber" style="top:60%;left:20%;color:white"></h1>

		<img class="doodle2" style="top:10%;left:90%" id="doodle2" src="./public/doodle2.png" alt="">
		<img class="doodle3" style="top:50%;left:10%" id="doodle3" src="./public/doodle3.png" alt="">
		<img class="doodle4" style="top:50%;left:70%;transform: rotateZ(20deg);" id="doodle4" src="./public/doodle4.png" alt="">

	</div>
</body>



<script>
	var video = document.getElementById("video")
	var canvas = document.getElementById("canvas")
	var canvasContext = canvas.getContext("2d")
	var bottom = document.getElementById("bottom")

	var timer = document.getElementById("timer")
	var muteButton = document.getElementById("muteButton")

	canvas.addEventListener("click", ()=>{
		video.muted = !video.muted
		if (video.muted){
			muteButton.src = "https://www.svgrepo.com/show/506727/mute.svg"
		}
		else{
			muteButton.src = "https://www.svgrepo.com/show/506778/volume-up.svg"
		}
	})

	var lastScroll = 0
	document.addEventListener("scroll", (event)=>{
		if (window.scrollY >= lastScroll){
			bottom.scrollIntoView({behavior:"smooth", block:"start"})
		}
		else if (window.scrollY < lastScroll){
			canvas.scrollIntoView({behavior:"smooth", block:"start"})
		}
		lastScroll = window.scrollY
	})

	function paintCanvas(){
		canvasContext.drawImage(video, 0,0, canvas.width,canvas.height)
		requestAnimationFrame(()=>{paintCanvas()})

	}

	let releaseDate = new Date ("April 21, 2026 00:00:00").getTime()

	function updateTimer(){
		var distance = releaseDate - (new Date().getTime());

		var days = Math.floor(distance / (1000 * 60 * 60 * 24));
		var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
		var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
		var seconds = Math.floor((distance % (1000 * 60)) / 1000);
		
		if (hours < 10){
			hours = "0" + hours
		}
		if (minutes < 10){
			minutes = "0" + minutes
		}
		if (seconds < 10){
			seconds = "0" + seconds
		}

		timer.textContent = days + ":" + hours + ":" + minutes + ":" + seconds ;
		requestAnimationFrame(()=>{updateTimer()})
	}
	
	setInterval(()=>{
		var eyeball = document.getElementById("doodle4")

		eyeball.src = "./public/doodle4part2.png"
		setTimeout(()=>{
			eyeball.src = "./public/doodle4.png"
		},500)

	},3000)

	requestAnimationFrame(()=>{
		video.play()
		paintCanvas()
		updateTimer()
	})

</script>

<script>
	var bottomTextBoxes = document.getElementsByClassName("bottomChangingText")
	var bottomTextNumbers = document.getElementsByClassName("bottomChangingNumber")

	const arrayOfWords = [
		// "hello",
		"i think im forever",
		"im on the ropes",
		"im never here",
		"lie to me",
		"dollar menu millionaire"
	]

	Array.from(bottomTextBoxes).forEach((element)=>{
				element.textContent = arrayOfWords[Math.floor(Math.random() * arrayOfWords.length )]
	})

	Array.from(bottomTextNumbers).forEach((element)=>{
				element.textContent = Math.floor(Math.random()*100000000000000000000000)
	})

	setInterval(()=>{
		Array.from(bottomTextBoxes).forEach((element)=>{
				element.textContent = arrayOfWords[Math.floor(Math.random() * arrayOfWords.length )]
		})


	}, 200)

	setInterval(()=>{

		Array.from(bottomTextNumbers).forEach((element)=>{
				element.textContent = Math.floor(Math.random()*100000000000000000)
		})

	}, 50)

	
</script>
