<style>
	canvas{
		width: 100%;
		height: 100%;
		/* object-fit:cover; */
	}

	.canvasText{
		position: absolute;
		top:0;
		height:100%;
		width:100%;
		text-align: center;
		align-content: center;
		color: black;
		pointer-events: none;
		font-family: 'Courier New', Courier, monospace;
	}
	body{
		overflow: hidden;
		background-color: white;
		padding: 0;
		margin:0
	}
</style>




<body>
	<canvas id="canvas" >
		
	</canvas>
	<h1 class="canvasText" id = "timer">
	</h1>
	<video id="video" src="./public/test.webm" controls autoplay hidden  loop></video>
</body>



<script>
	var video = document.getElementById("video")
	var canvas = document.getElementById("canvas")
	var canvasContext = canvas.getContext("2d")
	var video = document.getElementById("video")

	var timer = document.getElementById("timer")

	
	canvas.addEventListener("click", ()=>{
		video.play()
	})



	function paintCanvas(){
		canvasContext.drawImage(video, 0,0, canvas.width,canvas.height)
		requestAnimationFrame(()=>{paintCanvas()})

	}

	let releaseDate = new Date ("April 21, 2026 00:00:00").getTime()
	setInterval(()=>{
		var distance = releaseDate - (new Date().getTime());

		var days = Math.floor(distance / (1000 * 60 * 60 * 24));
		var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
		var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
		var seconds = Math.floor((distance % (1000 * 60)) / 1000);
		
		if (hours < 10){
			hours = "0" + hours
		}
		if (minutes < 10){
			minutes = "0" + minutes
		}
		if (seconds < 10){
			seconds = "0" + seconds
		}

		timer.textContent = days + ":" + hours + ":" + minutes + ":" + seconds ;
	},1000)


	requestAnimationFrame(()=>{paintCanvas()})
	


	

	
</script>
