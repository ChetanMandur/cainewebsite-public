<!-- Scroll script -->
<script>
	const sections = Array.from(document.getElementsByClassName("section"))
	const sectionsSize = sections.length

	var currentSection = 0 

	function scrollUp(){
		if (currentSection >0){
			currentSection--
			// console.log(currentSection)

		}
		scrollCaseHandler()
	}

	function scrollDown(){
		if (currentSection < sectionsSize-1){
			currentSection++
			// console.log(currentSection)
		}
		scrollCaseHandler()

	}

	function scrollCaseHandler(forcedSection){
		if (forcedSection!= null){
			currentSection = forcedSection
		}

		console.log(currentSection)

		function toTheTop(index){
			sections[index].style.top="-100%"
		}

		function toTheCenter(index){
			sections[index].style.top="0%"
		}

		function toTheBottom(index){
			sections[index].style.top="100%"
		}

		function chunkToTheTop(start, end){
			sections.slice(start,end).forEach((element, index) => {
				toTheTop(start+index)
			});
		}

		function chunkToTheCenter(start, end){
			sections.slice(start,end).forEach((element, index)=>{
				toTheCenter(start+index)
			})
		}

		function chunkToTheBottom(start, end){
			sections.slice(start,end).forEach((element, index) => {
				toTheBottom(start+index)
			});
		}

		

		switch (currentSection) {
			case 0:
				chunkToTheCenter(0,1)
				chunkToTheBottom(1)
				break;
			case 1:
				chunkToTheCenter(0,2)
				chunkToTheBottom(2)

				break;
			
			case 2:
				chunkToTheTop(0,1)
				chunkToTheCenter(1,3)
				chunkToTheBottom(3)
				break;

			case 3:
				chunkToTheTop(0,3)
				toTheCenter(1)
				toTheCenter(3)
				chunkToTheBottom(4)
				break;
			
			case 4:
				chunkToTheTop(0,4)
				toTheCenter(1)
				chunkToTheCenter(4,5)
				chunkToTheBottom(5)
				break;

			case 5:
				chunkToTheTop(0,4)
				toTheCenter(1)

				chunkToTheCenter(4,7)
				chunkToTheBottom(6)
				break;

			case 6:
				chunkToTheTop(0,4)
				toTheCenter(1)

				chunkToTheCenter(4,7)
				chunkToTheBottom(7)
				break;


			default:
				chunkToTheTop(0,currentSection)
				chunkToTheCenter(currentSection, currentSection+1)
				chunkToTheBottom(currentSection+1)
				break;
		}
	}

	// 			scrollUp()
	// 		}

	// Throttle function
	var scrolledDate = 0
	document.addEventListener("wheel", (event)=>{
		const date = new Date().getTime()
		// console.log((date - scrolledDate))
		if ((date - scrolledDate) > 500){
			if (event.deltaY > 0){
				scrollDown()
			}
			else if (event.deltaY < 0){
				scrollUp()
			}
			scrolledDate = new Date().getTime()
		}

	})

	document.addEventListener("pointerdown", (event)=>{
		event.preventDefault()
		var pointerDownPosition = event.offsetY
		var pointerMovePosition = 0
		// console.log("pointerDown", pointerDownPosition)

		function pointerMove (event) {
			event.preventDefault()

			pointerMovePosition = event.offsetY - pointerDownPosition
			// console.log("pointerMove", pointerMovePosition)
		}
		document.addEventListener("pointermove", pointerMove)

		document.addEventListener("pointerup", (event)=>{
			event.preventDefault()
			// console.log("pointerUp", pointerMovePosition)
			if (pointerMovePosition > 0){
				scrollUp()	

			}
			else if (pointerMovePosition < 0){
				scrollDown()

			}

			document.removeEventListener("pointermove", pointerMove)
		},{once:true})

	})
	
	document.addEventListener("keydown", (event)=>{
		// console.log(event.key, event.shiftKey,)
		upPressed = (event.key == "ArrowUp") || (event.key == "PageUp") || (event.key == "Home") || ((event.key == " " && event.shiftKey))
		downPressed = (event.key == "ArrowDown") || (event.key == "PageDown") || (event.key == "End") || ((event.key == " " && !event.shiftKey))

		if (upPressed){
			scrollUp()
		}
		else if (downPressed){
			scrollDown()
		}

	})
</script>

<!-- Timer Script -->
<script>
	var timer = document.getElementById("timer")
	
	let releaseDate = undefined

	async function getReleaseDate(){
		const releaseDateResponse = await fetch("https://broken-fire-bf4e.chetanmandur45.workers.dev/get/releaseDate")
		if (releaseDateResponse.ok){
			const result = await releaseDateResponse.json()
			console.log(result.releaseDate)
			return new Date(new Date(result.year, result.month, result.day, result.hours, result.minutes, result.seconds).toLocaleString("en-US", {timeZone: "America/New_York"}))
		}
		else{
			return new Date ("April 21, 2040 00:00:00").getTime()
		}
	}

	

	let timerUpdateAnimationID = null
	function updateTimer(){
		var distance = releaseDate - (new Date().getTime());

		var days = Math.floor(distance / (1000 * 60 * 60 * 24));
		var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
		var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
		var seconds = Math.floor((distance % (1000 * 60)) / 1000);
		var milliseconds = Math.floor((distance % (1000)));
		
		if (days < 10){
			days = "0" + days
		}
		
		if (hours < 10){
			hours = "0" + hours
		}
		if (minutes < 10){
			minutes = "0" + minutes
		}
		if (seconds < 10){
			seconds = "0" + seconds
		}

		if (milliseconds < 10){
			milliseconds = "0"+ "0" + milliseconds
		}
		else if (milliseconds < 100){
			milliseconds = "0" + milliseconds
		}

		timer.textContent = days + ":" + hours + ":" + minutes + ":" + seconds + ":" + milliseconds;

		if (distance <= 0){
			// console.log("STOP!", distance)
			timer.textContent = "00" + ":" + "00" + ":" + "00" + ":" + "00" + ":" + "000";
			cancelAnimationFrame(timerUpdateAnimationID)

			var timerSize = timer.textContent.length
			var timerDeleteAnimationId = null
			function deleteTimerText(){
				if (timerSize >= 0){
					timer.textContent = timer.textContent.slice(0,timerSize)
					timerSize--
				}
				else{
					clearInterval(timerDeleteAnimationId)

					var timerNewText = "ENTER"
					var timerNewTextCurrentIndex = 0
					var timerReplaceAnimationID = null
					function replaceTimerText(){
						if (timerNewTextCurrentIndex <= timerNewText.length){
							timer.textContent = timerNewText.slice(0,timerNewTextCurrentIndex)
							timerNewTextCurrentIndex++
						}
						else{
							clearInterval(timerReplaceAnimationID)
							timer.style.pointerEvents= "visibleFill"
							timer.style.cursor = "pointer"
							timer.addEventListener("pointerdown",()=>{
								var overlay = document.getElementById("overlay")
								var sectionsContainer = document.getElementById("sections-container")
								var youtubeVideoContainer = document.getElementById("youtube-video-container")
								var youtubeVideo = document.getElementById("youtube-video")
								var errorContainer = document.getElementById("error-container")
								
								async function getYoutubeLink(){
									const youtubeLinkResponse = await fetch("https://broken-fire-bf4e.chetanmandur45.workers.dev/get/youtubeLink")
									if (youtubeLinkResponse.ok){
										const result = await youtubeLinkResponse.json()
										console.log(result.youtubeLink)
										return result.youtubeLink
									}
									else{
										return "ERROR"
									}
								}

								getYoutubeLink().then((result)=>{
									if (result != "ERROR"){
										youtubeVideo.src = result
										youtubeVideoContainer.style.display="block"
									}
									else{
										console.log("not happy")
										errorContainer.style.display="block"
									}
									overlay.style.display="none"
									sectionsContainer.style.display="none"
								})
							})
						}
					}
					timerReplaceAnimationID = setInterval(()=>{replaceTimerText()},500)
				}
			}
			timerDeleteAnimationId=setInterval(()=>{deleteTimerText()},200)

		}
		else{
			timerUpdateAnimationID = requestAnimationFrame(()=>{updateTimer()})
		}
	}

	getReleaseDate().then((result)=>{
		releaseDate = result

		// let currentDate = new Date()
		// releaseDate = currentDate.setSeconds(currentDate.getSeconds() - 2)
	}).finally(()=>{
			timerUpdateAnimationID= requestAnimationFrame(()=>{
					updateTimer()
				})
		}
	)
</script>

<!-- Canvas Script -->
<script>
	var videos = Array.from(document.getElementsByTagName("video"))
	var canvases = Array.from(document.getElementsByTagName("canvas"))

	if (videos.length == canvases.length){
		for (var i=0; i<videos.length;i++){
			const video = videos[i]
			const canvas = canvases[i]
			const canvasContext = canvas.getContext("2d")
			video.play()

			function paintCanvas(video,canvas){
				canvasContext.drawImage(video, 0,0, canvas.width,canvas.height)
				requestAnimationFrame(()=>paintCanvas(video,canvas))
			}

			requestAnimationFrame(()=>{paintCanvas(video, canvas)})
		}
	}
	else{
		console.log("woahwoahwoah....woah")
	}


</script>
