<!-- Scroll script -->
<script>
	const sections = Array.from(document.getElementsByClassName("section"))
	const sectionsSize = sections.length

	var currentSection = 0 

	function scrollUp(){
		if (currentSection >0){
			currentSection--
			// console.log(currentSection)

		}
		scrollCaseHandler()
	}

	function scrollDown(){
		if (currentSection < sectionsSize-1){
			currentSection++
			// console.log(currentSection)
		}
		scrollCaseHandler()

	}

	function scrollCaseHandler(forcedSection){
		if (forcedSection!= null){
			currentSection = forcedSection
		}
		function toTheTop(sectionPart){
			sectionPart.forEach(element => {
				element.style.top="-100%"
			});
		}

		function toTheCenter(sectionPart){
			sectionPart.forEach(element=>{
				element.style.top="0%"
			})
		}

		function toTheBottom(sectionPart){
			sectionPart.forEach(element => {
				element.style.top="100%"
			});
		}

		switch (currentSection) {
			case 0:
				toTheCenter(sections.slice(0,1))
				toTheBottom(sections.slice(1))
				break;
			case 1:
				toTheCenter(sections.slice(0,2))
				toTheBottom(sections.slice(2))

				break;
			case 2:
				toTheTop(sections.slice(0,2))
				toTheCenter(sections.slice(2,3))
				toTheBottom(sections.slice(3))
				break;

			case 3:
				toTheTop(sections.slice(0,2))
				toTheCenter(sections.slice(2,4))
				toTheBottom(sections.slice(4))

				break;

			case 4:
				toTheTop(sections.slice(0,2))
				toTheCenter(sections.slice(2,5))
				toTheBottom(sections.slice(5))
				break;
			case 5:
				toTheTop(sections.slice(0,5))
				toTheCenter(sections.slice(5,6))

				break;
			default:
				break;
		}
	}

	// 	},600)
	// }

	// document.addEventListener("wheel", wheelEvent)

	var isScrolling = true
	document.addEventListener("wheel", (event)=>{
		if ((event.deltaY > 0 || event.deltaY < 0) && !isScrolling){
			console.log("SCROLL HIT")
			isScrolling = true

			if (event.deltaY > 0){
				scrollDown()
			}
			else if (event.deltaY < 0){
				scrollUp()
			}
		}
		else if ((event.deltaY == 0)&&( isScrolling)){
			console.log("SCROLL STOPPED")
			isScrolling = false
		}
		

	})
	// document.addEventListener("scroll",(event)=>{
	// 	console.log("hit")
	// })
	// document.addEventListener("wheel",(event)=>{
	// 	// console.log("hit!", event.deltaY)
	// 	event.stopPropagation()
	// 	if (event.deltaY > 0){

	// var lastScroll = 0

	// 	if ((lastScroll < event.offsetY) && pointerDown){

	// 	else if ((lastScroll > event.offsetY) && pointerDown){
	// 		scrollDown()
	// 	}

	// 	lastScroll = event.offsetY
	// })

	document.addEventListener("pointerdown", (event)=>{
		event.preventDefault()
		var pointerDownPosition = event.offsetY
		var pointerMovePosition = 0
		console.log("pointerDown", pointerDownPosition)

		function pointerMove (event) {
			event.preventDefault()

			pointerMovePosition = event.offsetY - pointerDownPosition
			console.log("pointerMove", pointerMovePosition)
		}
		document.addEventListener("pointermove", pointerMove)

		document.addEventListener("pointerup", (event)=>{
			event.preventDefault()
			console.log("pointerUp", pointerMovePosition)
			if (pointerMovePosition > 0){
				scrollUp()	

			}
			else if (pointerMovePosition < 0){
				scrollDown()

			}

			document.removeEventListener("pointermove", pointerMove)
		},{once:true})

	})
	
	document.addEventListener("keydown", (event)=>{
		console.log(event.key, event.shiftKey,)
		upPressed = (event.key == "ArrowUp") || (event.key == "PageUp") || (event.key == "Home") || ((event.key == " " && event.shiftKey))
		downPressed = (event.key == "ArrowDown") || (event.key == "PageDown") || (event.key == "End") || ((event.key == " " && !event.shiftKey))

		if (upPressed){
			scrollUp()
		}
		else if (downPressed){
			scrollDown()
		}

	})

<!-- Timer Script -->
<script>
	var timer = document.getElementById("timer")

	// let releaseDate = new Date ("April 21, 2026 00:00:00").getTime()
	
	let currentDate = new Date()
	let releaseDate = currentDate.setSeconds(currentDate.getSeconds() + 2)

	let timerAnimationID = null

	function updateTimer(){
		var distance = releaseDate - (new Date().getTime());

		var days = Math.floor(distance / (1000 * 60 * 60 * 24));
		var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
		var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
		var seconds = Math.floor((distance % (1000 * 60)) / 1000);
		var milliseconds = Math.floor((distance % (1000)));
		
		if (days < 10){
			days = "0" + days
		}
		
		if (hours < 10){
			hours = "0" + hours
		}
		if (minutes < 10){
			minutes = "0" + minutes
		}
		if (seconds < 10){
			seconds = "0" + seconds
		}

		if (milliseconds < 10){
			milliseconds = "0"+ "0" + milliseconds
		}
		else if (milliseconds < 100){
			milliseconds = "0" + milliseconds
		}

		timer.textContent = days + ":" + hours + ":" + minutes + ":" + seconds + ":" + milliseconds;

		if (distance <= 0){
			console.log("STOP!", distance)
			timer.textContent = "00" + ":" + "00" + ":" + "00" + ":" + "00" + ":" + "000";
			cancelAnimationFrame(timerAnimationID)
		}
		else{
			timerAnimationID = requestAnimationFrame(()=>{updateTimer()})
		}
	}

	timerAnimationID= requestAnimationFrame(()=>{
		updateTimer()
	})

</script>

<!-- Canvas Script -->
<script>
	var video = document.getElementById("video")
	var canvas = document.getElementById("canvas")
	var canvasContext = canvas.getContext("2d")

	var muteButton = document.getElementById("muteButton")

	function paintCanvas(){
		canvasContext.drawImage(video, 0,0, canvas.width,canvas.height)
		requestAnimationFrame(()=>{paintCanvas()})

	}

	muteButton.addEventListener("click", ()=>{
		video.muted = !video.muted
		if (video.muted){
			// muteButton.src = "https://www.svgrepo.com/show/506727/mute.svg"
			muteButton.textContent = "Sound On"
		}
		else{
			// muteButton.src = "https://www.svgrepo.com/show/506778/volume-up.svg"
			muteButton.textContent = "Sound Off"
		}
	})

	requestAnimationFrame(()=>{
		video.play()
		paintCanvas()
	})
</script>
